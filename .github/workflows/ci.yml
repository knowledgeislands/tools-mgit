name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    name: KI governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install and verify released KI
        env:
          KI_VERSION: v0.3.5
          KI_CLI_INSTALL_DIR: ${{ runner.temp }}/ki/bin
          KI_MAN_INSTALL_DIR: ${{ runner.temp }}/ki/man/man1
          KI_DATA_HOME: ${{ runner.temp }}/ki/data
          KI_CONFIG_HOME: ${{ runner.temp }}/ki/config
          KI_CACHE_HOME: ${{ runner.temp }}/ki/cache
          KI_STATE_HOME: ${{ runner.temp }}/ki/state
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.agents" "$HOME/.claude"
          printf '{}\n' > "$HOME/.claude/settings.json"
          curl --fail --silent --show-error --location --max-redirs 3 --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/ki-install.sh" "https://raw.githubusercontent.com/knowledgeislands/tools-ki/$KI_VERSION/install.sh"
          bash "$RUNNER_TEMP/ki-install.sh" "$KI_VERSION"
          export PATH="$KI_CLI_INSTALL_DIR:$PATH"
          test "$(command -v ki)" = "$KI_CLI_INSTALL_DIR/ki"
          test "$(ki --version)" = "${KI_VERSION#v}"
          ki manage diag | grep -F 'Installation: regular'
          ki manage diag | grep -F "Executable: $KI_CLI_INSTALL_DIR/ki"
          ki bootstrap
          ki registry add --repo .
          ki repo repair --repo .
          project_key=${GITHUB_WORKSPACE//\//-}
          mkdir -p "$HOME/.claude/projects/$project_key/memory"
          ki manage diag | grep -F 'Status: valid'
          ki harness list | grep -F 'knowledgeislands/ki-agentic-harness'
          {
            printf 'KI_CLI_INSTALL_DIR=%s\n' "$KI_CLI_INSTALL_DIR"
            printf 'KI_MAN_INSTALL_DIR=%s\n' "$KI_MAN_INSTALL_DIR"
            printf 'KI_DATA_HOME=%s\n' "$KI_DATA_HOME"
            printf 'KI_CONFIG_HOME=%s\n' "$KI_CONFIG_HOME"
            printf 'KI_CACHE_HOME=%s\n' "$KI_CACHE_HOME"
            printf 'KI_STATE_HOME=%s\n' "$KI_STATE_HOME"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$KI_CLI_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Audit
        run: ki repo audit --repo .

  lint:
    name: shellcheck
    needs: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck bin/mgit install.sh

  manual:
    name: mandoc
    needs: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mandoc
        run: sudo apt-get update && sudo apt-get install -y mandoc
      - name: Lint manual
        run: mandoc -T lint man/mgit.1

  test:
    name: bats
    needs: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and Zsh
        run: sudo apt-get update && sudo apt-get install -y bats zsh
      - name: Run tests
        run: bats tests/
