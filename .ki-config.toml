# Knowledge Islands repository configuration.
# Its presence declares conformance with the Knowledge Islands repository standard.

[repo]
harnesses = ["knowledgeislands/ki-agentic-harness"]

[skills.ki-repo]
repository = "https://github.com/knowledgeislands/tools-mgit"
title = "mgit"
description = "Run commands across many Git repositories at once — auto-discovered at runtime or pinned by an optional .mgit-workspace.toml manifest."
repo_code = "MGIT"
supported_runtimes = ["claude-code", "claude-desktop", "chatgpt-codex"]
visibility = "public"

# Custom topics describe this standalone Bash CLI more accurately than the default set.
[skills.ki-repo.checks]
topics = false

[skills.ki-git]

[skills.ki-authoring]

[skills.ki-guides]

[skills.ki-repo-project]

[skills.ki-repo-tools]

[skills.ki-work]
adapter = "roadmap"

[skills.ki-work-roadmap]
themes = ["cli"]

[skills.ki-work-roadmap.areas]
CLI = "cli"

[skills.ki-trades]

[skills.ki-trades.routes."knowledgeislands/ki-agentic-harness"]
import = ["work", "knowledge"]

[skills.ki-trades.routes."knowledgeislands/ki-techne-principal"]
import = ["work", "knowledge"]

[skills.ki-trades.routes."knowledgeislands/homebrew-tap"]
export = ["work"]

[skills.ki-trades.routes."knowledgeislands/tools-ki"]
export = ["work", "knowledge"]
import = ["work", "knowledge"]

[skills.ki-trades.routes."krisb/dotfiles"]
export = ["work", "knowledge"]
import = ["work", "knowledge"]

[skills.ki-tokenomics]

[skills.ki-housekeeping-claude]

[skills.ki-tokenomics-claude]

[skills.ki-tokenomics-codex]

[skills.ki-agora]

[skills.ki-agora.memberships.ki-all]
home = "https://github.com/knowledgeislands/ki-agentic-harness"
role = "maintainer"

[skills.ki-agora.memberships.ki-fnd]
home = "https://github.com/knowledgeislands/ki-agentic-harness"
role = "maintainer"

[skills.ki-specs]
